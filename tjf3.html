<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>TJF Imports — 3.0</title><style>:root{--bg:#080808;--gold:#d6b35a;--text:#f7f3eb;--muted:#aaa;--line:#292929}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.nav{position:sticky;top:0;z-index:20;background:#080808e8;backdrop-filter:blur(14px);border-bottom:1px solid #d6b35a26;display:flex;justify-content:space-between;align-items:center;padding:13px 5vw}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.1em;color:#fff;text-decoration:none}.brand img{width:42px;height:42px;object-fit:contain;border-radius:50%}.links{display:flex;gap:20px;font-size:14px}.links a{color:#aaa;text-decoration:none}.hero{min-height:70vh;display:grid;place-items:center;text-align:center;padding:70px 20px;background:radial-gradient(circle at 50% 15%,#332a18 0,#111 32%,#080808 68%)}.hero h1{font-family:Georgia,serif;font-size:clamp(54px,10vw,112px);line-height:.9;margin:20px 0;letter-spacing:-.06em}.hero p{max-width:600px;margin:auto;color:#aaa;font-size:17px;line-height:1.7}.eyebrow{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.3em}.cta{display:inline-block;margin-top:30px;padding:14px 24px;border-radius:999px;background:var(--gold);color:#111;font-weight:800;text-decoration:none}.search{max-width:620px;margin:-25px auto 0;padding:0 20px;position:relative;z-index:5}.search input{width:100%;padding:17px 20px;border-radius:999px;background:#111;border:1px solid #383838;color:white;outline:0}section{padding:62px 5vw 5px}.head h2{font:34px Georgia,serif;margin:0}.head p{color:#777}.row{display:flex;gap:17px;overflow-x:auto;padding:8px 2px 28px}.card{flex:0 0 210px;background:linear-gradient(180deg,#151515,#0e0e0e);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 12px 30px #0008}.photo{height:245px;border-radius:15px;background:#1a1a1a;overflow:hidden;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:contain}.info{padding:13px 4px 3px}.brandName{font-size:10px;color:var(--gold);letter-spacing:.13em;text-transform:uppercase}.name{font-weight:750;min-height:40px;margin:6px 0}.price{font-weight:850;font-size:18px}.wa{display:block;text-align:center;background:#f3efe6;color:#111;padding:10px;border-radius:12px;margin-top:12px;font-weight:800;font-size:13px;text-decoration:none}.footer{margin-top:65px;padding:30px 5vw;border-top:1px solid var(--line);color:#666}.loading{text-align:center;padding:60px;color:#aaa}@media(max-width:700px){.links{display:none}.hero{min-height:62vh}.card{flex-basis:175px}.photo{height:205px}}</style></head><body><nav class="nav"><a class="brand" href="#top"><img src="imagem/logo tjf.jpeg" alt="TJF"><span>TJF IMPORTS</span></a><div class="links" id="navLinks"></div></nav><header class="hero" id="top"><div><div class="eyebrow">TJF Imports • 3.0</div><h1>Fragrâncias que<br>deixam marca.</h1><p>Perfumes importados e produtos selecionados com qualidade, presença e personalidade.</p><a class="cta" href="#catalog">Explorar coleção</a></div></header><div class="search"><input id="search" placeholder="Buscar produto ou marca..."></div><div id="loading" class="loading">Carregando catálogo...</div><main id="catalog"></main><footer class="footer">© TJF Imports</footer><script>const API='https://gcaweowgciwpiqavzvne.supabase.co/rest/v1/products?select=id,name,brand,price,category,description,image_url,featured&active=eq.true&order=sort_order.asc,id.asc',KEY='sb_publishable_9VeIiemaoe4tp2FweaBOFg_zOKeZS7R';let products=[];const cats={masculino:['Masculinos','Presença e personalidade.'],feminino:['Femininos','Elegância em cada detalhe.'],unissex:['Unissex','Fragrâncias sem rótulos.'],luxuria:['Luxúria','Seleção premium.'],peptideos:['Peptídeos','Seleção de peptídeos TJF.']};const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function card(p){const tipo=p.category==='peptideos'?'produto':'perfume',m=encodeURIComponent(`Olá! Tenho interesse no ${tipo} ${p.name} (${p.brand}). Vi no catálogo da TJF Imports.`);return `<article class="card"><div class="photo"><img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy"></div><div class="info"><div class="brandName">${esc(p.brand)}</div><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><a class="wa" target="_blank" rel="noopener" href="https://wa.me/5511921959638?text=${m}">Tenho interesse</a></div></article>`}function render(q=''){const list=products.filter(p=>!q||`${p.name} ${p.brand}`.toLowerCase().includes(q.toLowerCase())),present=Object.keys(cats).filter(c=>list.some(p=>p.category===c));document.getElementById('navLinks').innerHTML=present.map(c=>`<a href="#${c}">${cats[c][0]}</a>`).join('');document.getElementById('catalog').innerHTML=present.map(c=>{const a=list.filter(p=>p.category===c);return `<section id="${c}"><div class="head"><h2>${cats[c][0]}</h2><p>${cats[c][1]}</p></div><div class="row">${a.map(card).join('')}</div></section>`}).join('')}async function load(){try{const r=await fetch(API,{headers:{apikey:KEY}});if(!r.ok)throw new Error();products=await r.json();document.getElementById('loading').style.display='none';render()}catch(e){document.getElementById('loading').textContent='Não foi possível carregar o catálogo. Tente novamente em instantes.'}}load();document.getElementById('search').addEventListener('input',e=>render(e.target.value));</script></body></html>
