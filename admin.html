<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TJF 3.0 Admin</title><style>body{margin:0;background:#080808;color:#eee;font:15px Arial}.box{max-width:1100px;margin:20px auto;padding:20px}button,input,select,textarea{padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{background:#d6b35a;color:#111;font-weight:bold;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.stats{display:flex;gap:12px}.stat,.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}.card img{width:100%;height:200px;object-fit:contain;background:#181818;border-radius:12px}.gold{color:#d6b35a}.modal{display:none;position:fixed;inset:0;background:#000c;padding:20px;overflow:auto;z-index:10}.form{max-width:550px;margin:20px auto;background:#121212;padding:24px;border-radius:20px}.field{margin:12px 0}.field>*{width:100%;box-sizing:border-box}.plus{display:flex!important;align-items:center;justify-content:center;background:#d6b35a;color:#111;padding:16px;border-radius:14px;font-weight:bold;cursor:pointer}.plus input{display:none!important}.preview{width:150px;height:150px;object-fit:contain;display:block;margin:12px auto;border-radius:12px;background:#181818}.actions{display:flex;gap:8px}.danger{background:#451919;color:#ffb0b0}.status{padding:12px;border-radius:12px;background:#111;color:#aaa;margin:15px 0}.ok{color:#8ed18e}.err{color:#ff9b9b}@media(max-width:600px){.stats{flex-direction:column}.box{padding:14px}}</style></head><body><main class="box"><div class="top"><b>TJF 3.0 • ADMIN</b><a href="tjf3.html"><button>Ver site</button></a></div><div id="status" class="status">Conectando ao banco...</div><div class="stats"><div class="stat">Produtos<br><b id="total">0</b></div><div class="stat">Ativos<br><b id="ativos">0</b></div></div><div style="display:flex;gap:10px;margin-top:20px"><input id="busca" placeholder="Buscar produto..." oninput="render()" style="flex:1"><button type="button" onclick="novo()">＋ Novo produto</button></div><div id="lista" class="grid"></div></main><div id="modal" class="modal"><div class="form"><h2 id="titulo">Novo produto</h2><form id="formProduto"><input id="id" type="hidden"><input id="oldUrl" type="hidden"><input id="oldPath" type="hidden"><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>Marca</label><input id="marca" required></div><div class="field"><label>Preço</label><input id="preco" type="number" step="0.01" min="0" required></div><div class="field"><label>Categoria</label><select id="cat"><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="unissex">Unissex</option><option value="luxuria">Luxúria</option><option value="peptideos">Peptídeos</option></select></div><div class="field"><label>Foto</label><label class="plus">＋ Adicionar foto da galeria<input id="foto" type="file" accept="image/*"></label><img id="preview" class="preview" style="display:none"></div><div class="field"><label>Descrição</label><textarea id="desc" rows="4"></textarea></div><label><input id="ativo" type="checkbox" checked> Produto ativo</label><br><label><input id="destaque" type="checkbox"> Destaque</label><br><br><div class="actions"><button id="saveBtn" type="submit">Salvar produto</button><button type="button" onclick="fechar()">Cancelar</button></div></form></div></div><script>const FN='https://gcaweowgciwpiqavzvne.supabase.co/functions/v1/admin-products',TOKEN='sVplqiWNJ24vdv6hM1J9D6BopV6P90gQpkUEiCS-kk4',APIKEY='sb_publishable_9VeIiemaoe4tp2FweaBOFg_zOKeZS7R';let produtos=[];const $=id=>document.getElementById(id);function msg(t,ok=true){$('status').textContent=t;$('status').className='status '+(ok?'ok':'err')}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function req(opts={}){const r=await fetch(FN,{...opts,headers:{apikey:APIKEY,'x-admin-token':TOKEN,...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erro no servidor');return j}async function carregar(){try{msg('Carregando produtos...');const j=await req();produtos=j.products||[];render();msg('✓ Banco online conectado. Alterações feitas aqui atualizam o site dos clientes.')}catch(e){msg('Erro: '+e.message,false)}}function render(){const q=$('busca').value.toLowerCase(),a=produtos.filter(p=>`${p.name} ${p.brand}`.toLowerCase().includes(q));$('total').textContent=produtos.length;$('ativos').textContent=produtos.filter(p=>p.active).length;$('lista').innerHTML=a.map(p=>`<div class="card"><img src="${esc(p.image_url)}" alt="${esc(p.name)}"><div class="gold">${esc(p.category)}</div><h3>${esc(p.name)}</h3><small>${esc(p.brand)}</small><h3>${Number(p.price).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</h3><div class="actions"><button onclick="editar(${p.id})">Editar</button><button class="danger" onclick="excluir(${p.id})">Excluir</button></div></div>`).join('')}function novo(){$('formProduto').reset();$('id').value='';$('oldUrl').value='';$('oldPath').value='';$('preview').style.display='none';$('titulo').textContent='Novo produto';$('modal').style.display='block'}function editar(id){const p=produtos.find(x=>x.id===id);if(!p)return;$('id').value=p.id;$('nome').value=p.name;$('marca').value=p.brand;$('preco').value=p.price;$('cat').value=p.category;$('desc').value=p.description||'';$('ativo').checked=!!p.active;$('destaque').checked=!!p.featured;$('oldUrl').value=p.image_url||'';$('oldPath').value=p.image_path||'';$('foto').value='';$('preview').src=p.image_url;$('preview').style.display='block';$('titulo').textContent='Editar produto';$('modal').style.display='block'}$('foto').addEventListener('change',()=>{const f=$('foto').files[0];if(!f)return;if(f.size>10*1024*1024){alert('Escolha uma imagem de até 10 MB.');$('foto').value='';return}const u=URL.createObjectURL(f);$('preview').src=u;$('preview').style.display='block'});$('formProduto').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData();fd.append('action','save');fd.append('id',$('id').value);fd.append('name',$('nome').value.trim());fd.append('brand',$('marca').value.trim());fd.append('price',$('preco').value);fd.append('category',$('cat').value);fd.append('description',$('desc').value.trim());fd.append('active',$('ativo').checked);fd.append('featured',$('destaque').checked);fd.append('existing_image_url',$('oldUrl').value);fd.append('existing_image_path',$('oldPath').value);if($('foto').files[0])fd.append('image',$('foto').files[0]);if(!$('oldUrl').value&&!$('foto').files[0]){alert('Adicione uma foto da galeria.');return}try{$('saveBtn').disabled=true;$('saveBtn').textContent='Salvando...';await req({method:'POST',body:fd});fechar();await carregar();alert('Produto salvo! Já está atualizado no catálogo dos clientes.')}catch(e){alert('Erro ao salvar: '+e.message)}finally{$('saveBtn').disabled=false;$('saveBtn').textContent='Salvar produto'}});async function excluir(id){const p=produtos.find(x=>x.id===id);if(!p||!confirm('Excluir '+p.name+'?'))return;const fd=new FormData();fd.append('action','delete');fd.append('id',id);try{await req({method:'POST',body:fd});await carregar()}catch(e){alert('Erro ao excluir: '+e.message)}}function fechar(){$('modal').style.display='none'}carregar();</script></body></html>
