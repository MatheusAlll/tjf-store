<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TJF 3.0 — Administrador</title><style>:root{--bg:#080808;--panel:#121212;--soft:#181818;--gold:#d6b35a;--text:#f7f3eb;--muted:#999;--line:#292929;--danger:#c65b5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#302716,#080808 55%)}.loginbox,.panel{background:linear-gradient(180deg,#151515,#101010);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px #0008}.loginbox{width:min(430px,100%);padding:34px}.logo{width:70px;height:70px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 18px}.login h1{text-align:center;font:34px Georgia,serif;margin:0}.sub{text-align:center;color:var(--muted);margin:8px 0 25px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:#aaa}.field input,.field select,.field textarea{width:100%;background:#0c0c0c;border:1px solid #333;border-radius:12px;color:#fff;padding:13px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--gold);color:#111;font-weight:800;cursor:pointer}.btn.secondary{background:#222;color:#eee;border:1px solid #333}.btn.danger{background:#3a1717;color:#ffb4b4}.app{display:none}.top{position:sticky;top:0;z-index:10;background:#080808e8;backdrop-filter:blur(14px);border-bottom:1px solid #d6b35a25;padding:13px 4vw;display:flex;align-items:center;justify-content:space-between}.topbrand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em}.topbrand img{width:40px;height:40px;object-fit:contain;border-radius:50%}.wrap{width:min(1200px,92%);margin:30px auto}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.stat small{color:#888}.stat strong{display:block;font-size:28px;margin-top:8px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0;flex-wrap:wrap}.toolbar input{flex:1;min-width:220px;background:#111;border:1px solid #333;color:#fff;border-radius:12px;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.product{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}.pimg{height:210px;border-radius:13px;background:#1a1a1a;display:grid;place-items:center;overflow:hidden}.pimg img{width:100%;height:100%;object-fit:contain}.pinfo{padding:12px 3px}.cat{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.pname{font-weight:800;margin:5px 0}.price{font-size:18px;font-weight:850}.status{font-size:11px;color:#8ecb8e;margin-top:5px}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1;padding:10px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;overflow:auto;padding:30px 15px}.modalbox{width:min(620px,100%);margin:auto;background:#111;border:1px solid #333;border-radius:22px;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal h2{font:28px Georgia,serif;margin:0}.close{background:none;border:0;color:#aaa;font-size:24px;cursor:pointer}.preview{width:120px;height:120px;border-radius:15px;background:#1a1a1a;object-fit:contain;margin-top:8px}.check{display:flex;gap:8px;align-items:center;color:#bbb}.error{color:#ff9c9c;font-size:13px;min-height:18px}.hint{color:#777;font-size:12px;line-height:1.5}@media(max-width:650px){.dash{grid-template-columns:1fr}.wrap{width:94%}}</style></head><body><div class="login" id="login"><div class="loginbox"><img class="logo" src="imagem/logo tjf.jpeg"><h1>TJF 3.0</h1><div class="sub">Painel do administrador</div><div class="field"><label>Senha</label><input id="password" type="password" placeholder="Digite a senha"></div><div class="error" id="loginError"></div><button class="btn" style="width:100%" onclick="login()">Entrar no painel</button><p class="hint">Protótipo administrativo local. A senha desta primeira versão é configurada no código e deve ser trocada antes de colocar o sistema em produção.</p></div></div><div class="app" id="app"><header class="top"><div class="topbrand"><img src="imagem/logo tjf.jpeg">TJF 3.0 • ADMIN</div><div style="display:flex;gap:8px"><a class="btn secondary" href="tjf3.html">Ver site</a><button class="btn secondary" onclick="logout()">Sair</button></div></header><main class="wrap"><div class="dash"><div class="stat"><small>Total de produtos</small><strong id="total">0</strong></div><div class="stat"><small>Produtos ativos</small><strong id="active">0</strong></div><div class="stat"><small>Destaques</small><strong id="featured">0</strong></div></div><div class="toolbar"><input id="filter" placeholder="Buscar perfume ou marca..." oninput="render()"><button class="btn" onclick="openNew()">+ Novo perfume</button></div><div class="grid" id="grid"></div></main></div><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Novo perfume</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="save(event)"><input type="hidden" id="id"><div class="field"><label>Nome do perfume</label><input id="name" required></div><div class="field"><label>Marca</label><input id="brand" required></div><div class="field"><label>Preço</label><input id="price" type="number" step="0.01" min="0" required></div><div class="field"><label>Categoria</label><select id="category" required><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="unissex">Unissex</option><option value="luxuria">Luxúria</option></select></div><div class="field"><label>Caminho da foto no catálogo</label><input id="image" placeholder="imagem/nome-do-arquivo.jpg" required><img id="preview" class="preview" alt="Prévia"></div><div class="field"><label>Descrição</label><textarea id="description" rows="4" placeholder="Descrição do perfume"></textarea></div><label class="check"><input id="active" type="checkbox" checked> Produto ativo no catálogo</label><label class="check" style="margin-top:10px"><input id="featuredFlag" type="checkbox"> Mostrar como destaque</label><div style="display:flex;gap:10px;margin-top:22px"><button class="btn" type="submit">Salvar produto</button><button class="btn secondary" type="button" onclick="closeModal()">Cancelar</button></div></form></div></div><script>const ADMIN_PASSWORD='TJF3@2026';const key='tjf_products';const seed=[['Yara Elau','Lattafa',259,'feminino','imagem/yara-elau.jpg'],['Yara Moi','Lattafa',176,'feminino','imagem/yara moi.jpg'],['Yara Tous','Lattafa',173,'feminino','imagem/yara tous.jpg'],['Yara Candy','Lattafa',166,'feminino','imagem/yara candy.jpg'],['Isabelle La Belle','Angel',252,'feminino','imagem/Isabelle La Belle Angel.jpg'],['Sara Eau Parfum','Nasma',156,'feminino','imagem/Sara Eau Parfum.jpg'],['Tharwah Gold','Lattafa',384,'feminino','imagem/Tharwah Gold [lataffa].jpg'],['Alora L’Affair','Alora',428,'luxuria','imagem/Alora L`Affair Extrait de Parfum.jpg'],['Eclaire','Lattafa',254,'feminino','imagem/Eclaire [Lattafa].jpg'],['Yum Yum','Yum Yum',328,'feminino','imagem/yum-yum.jpg'],['Petra','Lattafa',197,'feminino','imagem/Petra [Lattafa].jpg'],['Shagaf Al Ward','Swiss Arabian',145.6,'feminino','imagem/Shagaf Al Ward.jpg'],['Mayar','Lattafa',205,'feminino','imagem/Mayar [Lattafa].jpg'],['Musamam','Lattafa',340,'unissex','imagem/Lattafa Musamam.jpg'],['Moschino Toy 2 Bubble Gum','Moschino',468,'feminino','imagem/Moschino Toy 2 Bubble Gum.jpg'],['Vulcan Feu','French Avenue',432,'masculino','imagem/Vulcan Feu.jpg'],['Vanilla Voyage','Maison Asrar',399,'unissex','imagem/Vanilla Voyage [Maison asrar].jpeg'],['Jub Dalal','Lattafa',346.5,'luxuria','imagem/Jub Dalal [Lattafa] (2).jpeg'],['Queen of Arabia','Arabian Oud',462,'luxuria','imagem/queen of arabia.jpeg'],['Al Noble Blush','Lattafa',178.5,'feminino','imagem/Badde Al Oud [Lattafa].jpeg'],['Dania Orientica','Orientica',599.9,'luxuria','imagem/Orientica Exclusive Dania.jpeg'],['Delilah Pour Femme','Lattafa',220.5,'feminino','imagem/Delilah Pour femme.jpeg']].map((p,i)=>({id:'p'+i,name:p[0],brand:p[1],price:p[2],category:p[3],image:p[4],description:'Perfume importado selecionado pela TJF Imports.',active:true,featured:false}));let products=JSON.parse(localStorage.getItem(key)||'null');if(!products){products=seed;saveAll()}function saveAll(){localStorage.setItem(key,JSON.stringify(products))}function login(){if(document.getElementById('password').value===ADMIN_PASSWORD){sessionStorage.tjfAdmin='1';showApp()}else document.getElementById('loginError').textContent='Senha incorreta.'}function logout(){sessionStorage.removeItem('tjfAdmin');location.reload()}function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render()}if(sessionStorage.tjfAdmin==='1')showApp();function money(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function render(){const q=document.getElementById('filter')?.value.toLowerCase()||'';const list=products.filter(p=>`${p.name} ${p.brand}`.toLowerCase().includes(q));document.getElementById('total').textContent=products.length;document.getElementById('active').textContent=products.filter(p=>p.active).length;document.getElementById('featured').textContent=products.filter(p=>p.featured).length;document.getElementById('grid').innerHTML=list.map(p=>`<article class="product"><div class="pimg"><img src="${p.image}" alt="${p.name}"></div><div class="pinfo"><div class="cat">${p.category}</div><div class="pname">${p.name}</div><div style="color:#aaa;font-size:12px">${p.brand}</div><div class="price">${money(p.price)}</div><div class="status">${p.active?'● Ativo':'○ Oculto'} ${p.featured?' • Destaque':''}</div><div class="actions"><button class="btn secondary" onclick="edit('${p.id}')">Editar</button><button class="btn danger" onclick="removeProduct('${p.id}')">Excluir</button></div></div></article>`).join('')}function openNew(){document.getElementById('modalTitle').textContent='Novo perfume';document.querySelector('form').reset();document.getElementById('id').value='';document.getElementById('active').checked=true;document.getElementById('preview').src='';document.getElementById('modal').style.display='block'}function edit(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById('modalTitle').textContent='Editar perfume';for(const k of ['id','name','brand','price','category','image','description'])document.getElementById(k).value=p[k]??'';document.getElementById('active').checked=!!p.active;document.getElementById('featuredFlag').checked=!!p.featured;document.getElementById('preview').src=p.image;document.getElementById('modal').style.display='block'}function save(e){e.preventDefault();const id=document.getElementById('id').value||'p'+Date.now();const p={id,name:document.getElementById('name').value.trim(),brand:document.getElementById('brand').value.trim(),price:Number(document.getElementById('price').value),category:document.getElementById('category').value,image:document.getElementById('image').value.trim(),description:document.getElementById('description').value.trim(),active:document.getElementById('active').checked,featured:document.getElementById('featuredFlag').checked};const i=products.findIndex(x=>x.id===id);if(i>=0)products[i]=p;else products.unshift(p);saveAll();closeModal();render()}function removeProduct(id){const p=products.find(x=>x.id===id);if(!p)return;if(confirm(`Excluir ${p.name}?`)){products=products.filter(x=>x.id!==id);saveAll();render()}}function closeModal(){document.getElementById('modal').style.display='none'}document.getElementById('image').addEventListener('input',e=>document.getElementById('preview').src=e.target.value);document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
