<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TJF 3.0 Admin</title><style>body{margin:0;background:#080808;color:#eee;font:15px Arial}.box{max-width:1100px;margin:20px auto;padding:20px}button,input,select,textarea{padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{background:#d6b35a;color:#111;font-weight:bold;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.stats{display:flex;gap:12px}.stat,.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}.card img{width:100%;height:200px;object-fit:contain;background:#181818;border-radius:12px}.gold{color:#d6b35a}.modal{display:none;position:fixed;inset:0;background:#000c;padding:20px;overflow:auto;z-index:10}.form{max-width:550px;margin:20px auto;background:#121212;padding:24px;border-radius:20px}.field{margin:12px 0}.field>*{width:100%;box-sizing:border-box}.plus{display:flex!important;align-items:center;justify-content:center;gap:8px;background:#d6b35a;color:#111;padding:16px;border-radius:14px;font-weight:bold;cursor:pointer}.plus input{display:none!important}.preview{width:150px;height:150px;object-fit:contain;display:block;margin:12px auto;border-radius:12px;background:#181818}.actions{display:flex;gap:8px}.danger{background:#451919;color:#ffb0b0}.ok{color:#8ed18e;font-size:13px;margin-top:8px}@media(max-width:600px){.stats{flex-direction:column}.box{padding:14px}}</style></head><body><main id="app" class="box"><div class="top"><b>TJF 3.0 • ADMIN</b><a href="tjf3.html"><button>Ver site</button></a></div><div class="stats"><div class="stat">Produtos<br><b id="total">0</b></div><div class="stat">Ativos<br><b id="ativos">0</b></div></div><div style="display:flex;gap:10px;margin-top:20px"><input id="busca" placeholder="Buscar perfume..." oninput="render()" style="flex:1"><button type="button" onclick="novo()">＋ Novo perfume</button></div><div id="lista" class="grid"></div></main><div id="modal" class="modal"><div class="form"><h2 id="titulo">Novo perfume</h2><form id="formProduto"><input id="id" type="hidden"><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>Marca</label><input id="marca" required></div><div class="field"><label>Preço</label><input id="preco" type="number" step="0.01" min="0" required></div><div class="field"><label>Categoria</label><select id="cat"><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="unissex">Unissex</option><option value="luxuria">Luxúria</option></select></div><div class="field"><label>Foto</label><label class="plus">＋ Adicionar foto da galeria<input id="foto" type="file" accept="image/*"></label><img id="preview" class="preview" style="display:none"><div id="fotoStatus" class="ok"></div></div><div class="field"><label>Descrição</label><textarea id="desc" rows="4"></textarea></div><label><input id="ativo" type="checkbox" checked> Produto ativo</label><br><br><div class="actions"><button type="submit">Salvar produto</button><button type="button" onclick="fechar()">Cancelar</button></div></form></div></div><script>const KEY='tjf_products';let produtos=[];let imagemAtual='';const base='imagem/';const seeds=[['Yara Elau','Lattafa',259,'feminino','yara-elau.jpg'],['Yara Moi','Lattafa',176,'feminino','yara moi.jpg'],['Yara Tous','Lattafa',173,'feminino','yara tous.jpg'],['Yara Candy','Lattafa',166,'feminino','yara candy.jpg'],['Isabelle La Belle','Angel',252,'feminino','Isabelle La Belle Angel.jpg'],['Sara Eau Parfum','Nasma',156,'feminino','Sara Eau Parfum.jpg'],['Tharwah Gold','Lattafa',384,'feminino','Tharwah Gold [lataffa].jpg'],['Alora L’Affair','Alora',428,'luxuria','Alora L`Affair Extrait de Parfum.jpg'],['Eclaire','Lattafa',254,'feminino','Eclaire [Lattafa].jpg'],['Yum Yum','Yum Yum',328,'feminino','yum-yum.jpg'],['Petra','Lattafa',197,'feminino','Petra [Lattafa].jpg'],['Shagaf Al Ward','Swiss Arabian',145.6,'feminino','Shagaf Al Ward.jpg'],['Mayar','Lattafa',205,'feminino','Mayar [Lattafa].jpg'],['Musamam','Lattafa',340,'unissex','Lattafa Musamam.jpg'],['Moschino Toy 2 Bubble Gum','Moschino',468,'feminino','Moschino Toy 2 Bubble Gum.jpg'],['Vulcan Feu','French Avenue',432,'masculino','Vulcan Feu.jpg'],['Vanilla Voyage','Maison Asrar',399,'unissex','Vanilla Voyage [Maison asrar].jpeg'],['Jub Dalal','Lattafa',346.5,'luxuria','Jub Dalal [Lattafa] (2).jpeg'],['Queen of Arabia','Arabian Oud',462,'luxuria','queen of arabia.jpeg'],['Al Noble Blush','Lattafa',178.5,'feminino','Badde Al Oud [Lattafa].jpeg'],['Dania Orientica','Orientica',599.9,'luxuria','Orientica Exclusive Dania.jpeg'],['Delilah Pour Femme','Lattafa',220.5,'feminino','Delilah Pour femme.jpeg'],['212 Men NYC','Carolina Herrera',0,'masculino','212 men nyc.jpg'],['212 VIP Black','Carolina Herrera',0,'masculino','212 vip black.jpeg'],['212 VIP Men','Carolina Herrera',0,'masculino','212 vip men.jpeg'],['212 VIP Rosé','Carolina Herrera',0,'feminino','212 vip rose.jpeg'],['9 PM Rebel','Afnan',0,'masculino','Afnan – 9 PM Rebel.jpg'],['Ameerat Al Arab','Lattafa',0,'feminino','Ameerat Al Arab.jpg'],['Asad Bourbon Body Splash','Lattafa',0,'masculino','Asad Burbon Body splash.jpg'],['Asad','Lattafa',0,'masculino','Assad-lattafa.jpg'],['Asad Zanzibar','Lattafa',0,'masculino','Lattafa – Asad Zanzibar.jpg'],['Atheeri','Lattafa',0,'feminino','Atheeri.jpg'],['Coach Green','Coach',0,'masculino','Coach Green [Coach New York].jpg'],['Coach Open Road','Coach',0,'masculino','Coach Open Road.jpg'],['Dear Body Royal Amber','Dear Body',0,'feminino','Dear Body – Royal Amber.jpg'],['Fakhar','Lattafa',0,'masculino','Fakhar Lattafa.jpg'],['Light Blue','Dolce & Gabbana',0,'unissex','Light Blue.jpg'],['Maahir Legacy','Lattafa',0,'masculino','Maahir Legacy [Lattafa].jpeg'],['Pisa','Lattafa',0,'masculino','Pisa Lattafa.jpeg'],['Victoria Secret Rush','Victoria Secret',0,'feminino','Victoria Secret [Rush].jpg'],['Women Secret Rose Seduction','Women Secret',0,'feminino','Women Secret Rose Seduction.jpg'],['Amouage Interlude','Amouage',0,'masculino','amouage interlude.jpeg'],['Athena','Maison Alhambra',0,'feminino','athena [Maison Alhambra].jpeg'],['Bleu de Chanel','Chanel',0,'masculino','bleu de chanel.jpeg'],['Club de Nuit','Armaf',0,'masculino','club-de-nuit.jpg'],['Le Male Elixir','Jean Paul Gaultier',0,'masculino','le male elixir.jpg'],['Mancera Red Tobacco','Mancera',0,'unissex','mancera paris red tabacco.jpg'],['Mercedes-Benz','Mercedes-Benz',0,'masculino','mercedes-benz.jpg'],['Asad','Lattafa',0,'masculino','perfume-asad.jpg'],['Ultra Male','Jean Paul Gaultier',0,'masculino','ultra male.jpg']];function carregar(){try{produtos=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){produtos=[]}if(!Array.isArray(produtos))produtos=[];const nomes=new Set(produtos.map(p=>(p.nome||'').toLowerCase()));seeds.forEach((s,i)=>{if(!nomes.has(s[0].toLowerCase()))produtos.push({id:'seed'+i,nome:s[0],marca:s[1],preco:s[2],cat:s[3],imagem:base+s[4],desc:'',ativo:true})});persist()}function persist(){try{localStorage.setItem(KEY,JSON.stringify(produtos));return true}catch(e){alert('Não foi possível salvar. A imagem ficou grande demais para o armazenamento do navegador. Escolha outra foto ou tente novamente.');return false}}function render(){const q=document.getElementById('busca').value.toLowerCase();const a=produtos.filter(p=>(p.nome+' '+p.marca).toLowerCase().includes(q));document.getElementById('total').textContent=produtos.length;document.getElementById('ativos').textContent=produtos.filter(p=>p.ativo).length;document.getElementById('lista').innerHTML=a.map(p=>`<div class="card"><img src="${p.imagem||''}" onerror="this.style.display='none'"><div class="gold">${p.cat}</div><h3>${p.nome}</h3><small>${p.marca}</small><h3>${p.preco>0?'R$ '+Number(p.preco).toFixed(2).replace('.',','):'Preço não definido'}</h3><div class="actions"><button type="button" onclick="editar('${p.id}')">Editar</button><button type="button" class="danger" onclick="excluir('${p.id}')">Excluir</button></div></div>`).join('')}function novo(){document.getElementById('formProduto').reset();document.getElementById('id').value='';document.getElementById('ativo').checked=true;document.getElementById('foto').value='';imagemAtual='';document.getElementById('preview').style.display='none';document.getElementById('fotoStatus').textContent='';document.getElementById('titulo').textContent='Novo perfume';document.getElementById('modal').style.display='block'}function editar(id){const p=produtos.find(x=>x.id===id);if(!p)return;document.getElementById('id').value=p.id;document.getElementById('nome').value=p.nome;document.getElementById('marca').value=p.marca;document.getElementById('preco').value=p.preco||'';document.getElementById('cat').value=p.cat;document.getElementById('desc').value=p.desc||'';document.getElementById('ativo').checked=!!p.ativo;imagemAtual=p.imagem||'';document.getElementById('foto').value='';if(imagemAtual){document.getElementById('preview').src=imagemAtual;document.getElementById('preview').style.display='block'}document.getElementById('titulo').textContent='Editar perfume';document.getElementById('modal').style.display='block'}function comprimir(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const max=1000;let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=e.target.result};r.onerror=reject;r.readAsDataURL(file)})}document.getElementById('foto').addEventListener('change',async function(){const f=this.files[0];if(!f)return;if(f.size>12*1024*1024){alert('Essa foto é muito grande. Escolha uma foto de até 12 MB.');this.value='';return}try{imagemAtual=await comprimir(f);document.getElementById('preview').src=imagemAtual;document.getElementById('preview').style.display='block';document.getElementById('fotoStatus').textContent='✓ Foto selecionada e pronta para salvar'}catch(e){alert('Não consegui ler essa foto. Escolha outra.')}});document.getElementById('formProduto').addEventListener('submit',function(e){e.preventDefault();salvar()});function salvar(){const nome=document.getElementById('nome').value.trim(),marca=document.getElementById('marca').value.trim(),preco=Number(document.getElementById('preco').value),cat=document.getElementById('cat').value,id=document.getElementById('id').value||'p'+Date.now(),desc=document.getElementById('desc').value.trim(),ativo=document.getElementById('ativo').checked;if(!nome||!marca||!Number.isFinite(preco)||preco<0){alert('Preencha nome, marca e preço corretamente.');return}if(!imagemAtual){alert('Clique em ＋ Adicionar foto da galeria e escolha a foto do perfume.');return}const p={id,nome,marca,preco,cat,imagem:imagemAtual,desc,ativo};const i=produtos.findIndex(x=>x.id===id);if(i>=0)produtos[i]=p;else produtos.unshift(p);if(persist()){fechar();render();alert('Produto cadastrado com sucesso!')}}function excluir(id){const p=produtos.find(x=>x.id===id);if(p&&confirm('Excluir '+p.nome+'?')){produtos=produtos.filter(x=>x.id!==id);persist();render()}}function fechar(){document.getElementById('modal').style.display='none'}carregar();render();</script></body></html>
