<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TJF 3.0 Admin</title><style>body{margin:0;background:#080808;color:#eee;font:15px Arial}.box{max-width:1100px;margin:30px auto;padding:20px}button,input,select,textarea{padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{background:#d6b35a;color:#111;font-weight:bold;cursor:pointer}.login{max-width:360px;margin:15vh auto;text-align:center}.app{display:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.stats{display:flex;gap:12px}.stat,.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}.card img{width:100%;height:200px;object-fit:contain;background:#181818;border-radius:12px}.gold{color:#d6b35a}.modal{display:none;position:fixed;inset:0;background:#000c;padding:20px;overflow:auto}.form{max-width:550px;margin:20px auto;background:#121212;padding:24px;border-radius:20px}.field{margin:12px 0}.field>*{width:100%;box-sizing:border-box}.plus{display:flex!important;align-items:center;justify-content:center;gap:8px;background:#d6b35a;color:#111;padding:16px;border-radius:14px;font-weight:bold;cursor:pointer}.plus input{display:none!important}.preview{width:150px;height:150px;object-fit:contain;display:block;margin:12px auto;border-radius:12px;background:#181818}.actions{display:flex;gap:8px}.danger{background:#451919;color:#ffb0b0}@media(max-width:600px){.stats{flex-direction:column}.box{padding:14px}}</style><body><div id="login" class="box login"><h1>TJF 3.0</h1><p>Painel administrativo</p><input id="pass" type="password" placeholder="Senha"><br><br><button onclick="entrar()">Entrar</button></div><div id="app" class="box app"><div class="top"><b>TJF 3.0 • ADMIN</b><div><a href="tjf3.html"><button>Ver site</button></a><button onclick="sair()">Sair</button></div></div><div class="stats"><div class="stat">Produtos<br><b id="total">0</b></div><div class="stat">Ativos<br><b id="ativos">0</b></div></div><div style="display:flex;gap:10px;margin-top:20px"><input id="busca" placeholder="Buscar perfume..." oninput="render()" style="flex:1"><button onclick="novo()">＋ Novo perfume</button></div><div id="lista" class="grid"></div></div><div id="modal" class="modal"><div class="form"><h2 id="titulo">Novo perfume</h2><input id="id" type="hidden"><div class="field"><label>Nome</label><input id="nome" required></div><div class="field"><label>Marca</label><input id="marca" required></div><div class="field"><label>Preço</label><input id="preco" type="number" step="0.01" required></div><div class="field"><label>Categoria</label><select id="cat"><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="unissex">Unissex</option><option value="luxuria">Luxúria</option></select></div><div class="field"><label>Foto</label><label class="plus">＋ Adicionar foto da galeria<input id="foto" type="file" accept="image/*"></label><img id="preview" class="preview" style="display:none"></div><div class="field"><label>Descrição</label><textarea id="desc" rows="4"></textarea></div><label><input id="ativo" type="checkbox" checked> Produto ativo</label><br><br><div class="actions"><button onclick="salvar()">Salvar</button><button onclick="fechar()">Cancelar</button></div></div></div><script>const SENHA='TJF3@2026',KEY='tjf_products';let produtos=JSON.parse(localStorage.getItem(KEY)||'[]');let imagemAtual='';const seeds=[['Yara Elau','Lattafa',259,'feminino'],['Yara Moi','Lattafa',176,'feminino'],['Yara Tous','Lattafa',173,'feminino'],['Yara Candy','Lattafa',166,'feminino'],['Isabelle La Belle','Angel',252,'feminino'],['Sara Eau Parfum','Nasma',156,'feminino'],['Tharwah Gold','Lattafa',384,'feminino'],['Alora L’Affair','Alora',428,'luxuria'],['Eclaire','Lattafa',254,'feminino'],['Yum Yum','Yum Yum',328,'feminino'],['Petra','Lattafa',197,'feminino'],['Shagaf Al Ward','Swiss Arabian',145.6,'feminino'],['Mayar','Lattafa',205,'feminino'],['Musamam','Lattafa',340,'unissex'],['Moschino Toy 2 Bubble Gum','Moschino',468,'feminino'],['Vulcan Feu','French Avenue',432,'masculino'],['Vanilla Voyage','Maison Asrar',399,'unissex'],['Jub Dalal','Lattafa',346.5,'luxuria'],['Queen of Arabia','Arabian Oud',462,'luxuria'],['Al Noble Blush','Lattafa',178.5,'feminino'],['Dania Orientica','Orientica',599.9,'luxuria'],['Delilah Pour Femme','Lattafa',220.5,'feminino']];if(!produtos.length)produtos=seeds.map((p,i)=>({id:'p'+i,nome:p[0],marca:p[1],preco:p[2],cat:p[3],imagem:'',desc:'',ativo:true}));function persist(){localStorage.setItem(KEY,JSON.stringify(produtos))}persist();function entrar(){if(document.getElementById('pass').value===SENHA){sessionStorage.setItem('tjfAdmin','1');mostrar()}else{document.getElementById('pass').value='';alert('Senha incorreta. Tente novamente.')}}document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});function mostrar(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render()}if(sessionStorage.getItem('tjfAdmin')==='1')mostrar();function sair(){sessionStorage.removeItem('tjfAdmin');location.reload()}function render(){let q=document.getElementById('busca').value.toLowerCase();let a=produtos.filter(p=>(p.nome+' '+p.marca).toLowerCase().includes(q));document.getElementById('total').textContent=produtos.length;document.getElementById('ativos').textContent=produtos.filter(p=>p.ativo).length;document.getElementById('lista').innerHTML=a.map(p=>`<div class="card"><img src="${p.imagem||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%23aaa%22%3ESEM FOTO%3C/text%3E%3C/svg%3E'}"><div class="gold">${p.cat}</div><h3>${p.nome}</h3><small>${p.marca}</small><h3>R$ ${Number(p.preco).toFixed(2).replace('.',',')}</h3><div class="actions"><button onclick="editar('${p.id}')">Editar</button><button class="danger" onclick="excluir('${p.id}')">Excluir</button></div></div>`).join('')}function novo(){document.querySelectorAll('#modal input:not(#foto),#modal textarea').forEach(x=>x.value='');document.getElementById('id').value='';document.getElementById('ativo').checked=true;imagemAtual='';document.getElementById('preview').style.display='none';document.getElementById('titulo').textContent='Novo perfume';document.getElementById('modal').style.display='block'}function editar(id){let p=produtos.find(x=>x.id===id);document.getElementById('id').value=p.id;document.getElementById('nome').value=p.nome;document.getElementById('marca').value=p.marca;document.getElementById('preco').value=p.preco;document.getElementById('cat').value=p.cat;document.getElementById('desc').value=p.desc||'';document.getElementById('ativo').checked=p.ativo;imagemAtual=p.imagem||'';if(imagemAtual){document.getElementById('preview').src=imagemAtual;document.getElementById('preview').style.display='block'}document.getElementById('titulo').textContent='Editar perfume';document.getElementById('modal').style.display='block'}document.getElementById('foto').addEventListener('change',function(){let f=this.files[0];if(!f)return;if(f.size>5*1024*1024){alert('A foto deve ter até 5 MB.');this.value='';return}let r=new FileReader();r.onload=e=>{imagemAtual=e.target.result;document.getElementById('preview').src=imagemAtual;document.getElementById('preview').style.display='block'};r.readAsDataURL(f)});function salvar(){let id=document.getElementById('id').value||'p'+Date.now();let p={id,nome:document.getElementById('nome').value.trim(),marca:document.getElementById('marca').value.trim(),preco:Number(document.getElementById('preco').value),cat:document.getElementById('cat').value,imagem:imagemAtual,desc:document.getElementById('desc').value.trim(),ativo:document.getElementById('ativo').checked};if(!p.nome||!p.marca||!p.preco||!p.imagem){alert('Preencha os dados e adicione a foto pelo botão ＋.');return}let i=produtos.findIndex(x=>x.id===id);if(i>=0)produtos[i]=p;else produtos.unshift(p);persist();fechar();render()}function excluir(id){let p=produtos.find(x=>x.id===id);if(confirm('Excluir '+p.nome+'?')){produtos=produtos.filter(x=>x.id!==id);persist();render()}}function fechar(){document.getElementById('modal').style.display='none'}</script></body></html>
